<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MioVRCA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='20' rx='4' fill='%23ff5a6a'/%3E%3Cpath d='M9 7V5a7 7 0 0 1 14 0v2' stroke='%23ff5a6a' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<script>/* the look before the first paint (theme.js keeps it up to date) */
(function () { try { var d = document.documentElement, t = localStorage.getItem("mio.theme") || "dark", a = localStorage.getItem("mio.accent"), m = localStorage.getItem("mio.motion");
  if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  d.dataset.theme = t === "light" ? "light" : "dark"; if (a && a !== "sakura") d.dataset.accent = a;
  d.dataset.motion = m === "reduce" || matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduce" : "full"; } catch (e) {} })();</script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="social.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="oneclick.css">
<link rel="stylesheet" href="newbie.css">

<script>window.API_TOKEN = "__TOKEN__"; window.LANG = "__LANG__";</script>

<body>
<header class="top">
  <button id="btnSide" class="btn icon sidebtn" title="筛选与分类" aria-label="筛选与分类" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="brand" id="brand" data-link="site" title="打开 MioVRCA 官网"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="19" rx="4"/><path d="M10 9V7a6 6 0 0 1 12 0v2"/></svg><span>MioVRCA</span></button>
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="搜索名称、店铺、标签、路径" autocomplete="off"></label>
  <select id="sort" title="排序">
    <option value="recent">最近添加</option>
    <option value="name">名称</option>
    <option value="size">占用空间</option>
    <option value="used">使用中优先</option>
  </select>
  <select id="shopSort" title="排序" hidden>
    <option value="popular">人气</option>
    <option value="new">最新上架</option>
    <option value="cheap">价格从低到高</option>
    <option value="pricey">价格从高到低</option>
  </select>
  <button id="btnPanAdd" class="btn addpan fold" title="添加网盘分享（百度网盘、Google Drive、Dropbox）" aria-label="网盘素材：添加网盘分享（百度网盘、Google Drive、Dropbox）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>网盘素材</span></button>
  <button id="btnUpdate" class="btn update" hidden></button>
  <button id="btnScan" class="btn scan fold" title="重新扫描" aria-label="重新扫描"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span>重新扫描</span></button>
</header>

<div class="layout">
  <nav class="rail" id="rail" aria-label="视图">
    <button id="vLib" class="railbtn on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>素材库</span></button>
    <button id="vProj" class="railbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-1.5A5.5 5.5 0 0 1 10.5 14h3a5.5 5.5 0 0 1 5.5 5.5V21"/></svg><span>我的模型</span></button>
    <button id="vSocial" class="railbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M16 14.3c2.5-.2 4.2 1.4 4.6 4.2"/></svg><span>社区</span></button>
    <button id="vShop" class="railbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg><span>商店</span></button>
    <span class="grow"></span>
    <button class="railbtn small" data-theme-toggle title="深色 / 浅色" aria-label="深色 / 浅色"><svg class="ico-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ico-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="btnSettings" class="railbtn small" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="clipbar" id="clipbar" hidden></div>
    <div class="resultbar" id="resultbar"></div>
    <div class="grid" id="grid"></div>
    <section class="webview" id="webview" hidden><div class="webbar" id="webbar"></div><div class="webhost" id="webhost"></div></section>
  </main>
</div>

<footer class="status" id="status"></footer>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1"></div>
<div class="offline" id="offline" role="alert" hidden>与程序的连接已断开，正在重试…</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="guide" class="guide-window" aria-labelledby="guide-title"></dialog>

<script src="newbie.js"></script>
